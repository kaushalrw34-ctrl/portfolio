<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sihBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0c2540"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sihOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sihGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sihBg)"/>

  <!-- Tricolor Accent Top Accent -->
  <rect x="0" y="0" width="800" height="5" fill="#f97316"/>
  <rect x="0" y="5" width="800" height="4" fill="#ffffff" opacity="0.9"/>
  <rect x="0" y="9" width="800" height="5" fill="#10b981"/>

  <!-- Subtle circuit tech lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M50 100 H150 L200 150 H350"/>
    <circle cx="350" cy="150" r="4" fill="#38bdf8"/>
    <path d="M750 350 H650 L600 300 H450"/>
    <circle cx="450" cy="300" r="4" fill="#38bdf8"/>
    <path d="M100 400 H220 L270 350 H380"/>
    <circle cx="380" cy="350" r="4" fill="#38bdf8"/>
    <path d="M700 80 H580 L530 130 H420"/>
    <circle cx="420" cy="130" r="4" fill="#38bdf8"/>
  </g>

  <!-- Hackathon Emblem Card -->
  <g transform="translate(140, 70)">
    <rect width="520" height="310" rx="20" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Header Badge -->
    <rect x="35" y="30" width="450" height="46" rx="10" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="1"/>
    <text x="260" y="59" fill="#f97316" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">SMART INDIA HACKATHON</text>

    <!-- Round Qualification Ribbon -->
    <rect x="135" y="95" width="250" height="28" rx="14" fill="url(#sihGreen)"/>
    <text x="260" y="114" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">INSTITUTIONAL ROUND SELECTED</text>

    <!-- Hackathon Features Display -->
    <g transform="translate(40, 145)">
      <!-- Box 1: Team & Collaboration -->
      <rect x="0" y="0" width="135" height="120" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="67" cy="40" r="20" fill="rgba(56,189,248,0.15)"/>
      <text x="67" y="47" fill="#38bdf8" font-family="sans-serif" font-size="18" text-anchor="middle">👥</text>
      <text x="67" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Team Collab</text>
      <text x="67" y="98" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">JSPM RSCOE</text>

      <!-- Box 2: Problem Solving -->
      <rect x="152" y="0" width="135" height="120" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="219" cy="40" r="20" fill="rgba(249,115,22,0.15)"/>
      <text x="219" y="47" fill="#f97316" font-family="sans-serif" font-size="18" text-anchor="middle">💡</text>
      <text x="219" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Innovation</text>
      <text x="219" y="98" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Real-World Solution</text>

      <!-- Box 3: Development -->
      <rect x="305" y="0" width="135" height="120" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="372" cy="40" r="20" fill="rgba(16,185,129,0.15)"/>
      <text x="372" y="47" fill="#10b981" font-family="sans-serif" font-size="18" text-anchor="middle">⚙️</text>
      <text x="372" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Prototype</text>
      <text x="372" y="98" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">In Progress</text>
    </g>
  </g>

  <!-- Status Tag -->
  <rect x="630" y="25" width="130" height="30" rx="15" fill="#f59e0b"/>
  <circle cx="645" cy="40" r="4" fill="#ffffff"/>
  <text x="657" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">IN PROGRESS</text>
</svg>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Kaushal Wani Portfolio</title>
  <meta name="description" content="Page not found - Kaushal Wani portfolio">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-card {
      max-width: 540px;
      padding: 3rem 2.5rem;
    }
  </style>
</head>
<body>
  <div class="scroll-progress-bar" id="scroll-progress" aria-hidden="true"></div>

  <div class="error-container">
    <div class="hero-glow-bg" style="top: 20%; left: 30%;"></div>
    <div class="glass-card error-card">
      <div class="error-code">404</div>
      <h1 style="font-size: 1.85rem; margin-bottom: 0.75rem;">Page Not Found</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">
        The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
      </p>
      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">
          <i class="fas fa-home"></i> Back to Homepage
        </a>
        <a href="index.html#contact" class="btn btn-secondary">
          <i class="fas fa-envelope"></i> Contact Kaushal
        </a>
      </div>
    </div>
  </div>

  <script>
    // Inherit theme from localStorage
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  </script>
</body>
</html>
